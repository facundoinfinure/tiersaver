# Shopify app configuration. client_id is filled by `shopify app config link`
# once the app exists in the Dev Dashboard.
client_id = ""
name = "TierSaver for Klaviyo"
embedded = true

[access_scopes]
# read_all_orders and protected customer data (email) are requested in Phase 3,
# after Shopify approves them in the Dev Dashboard.
scopes = "read_orders"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Keeps buyer protection current. Needs protected customer data access (email).
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  # Mandatory compliance topics for App Store apps.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
