# Shopify app configuration. client_id comes from the app's Settings page in the
# Dev Dashboard. Deployed with `shopify app deploy` (see docs/13-INSTRUCTIVO-CUENTAS.md).
client_id = "df0c06b9c152f35785669afb4c2fe5e2"
# App Store name (30-character limit). The full product name is
# "TierSaver: List Hygiene for Klaviyo"; "list hygiene" goes in the listing subtitle.
name = "TierSaver for Klaviyo"
application_url = "https://tiersaver-app.tiersaver.workers.dev"
embedded = true

[auth]
redirect_urls = ["https://tiersaver-app.tiersaver.workers.dev/auth/callback"]

[access_scopes]
# read_all_orders and protected customer data (email) are requested in Phase 3,
# after Shopify approves them in the Dev Dashboard.
scopes = "read_orders,read_all_orders"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # The shop's TierSaver plan changed at Shopify (approved, declined, cancelled, frozen): keeps the app's copy of
  # the plan current (app/billing/billing.ts). Needs no access scope.
  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app/subscriptions_update"

  # Optional accelerator: makes a new buyer visible within seconds instead of at the
  # next orders sync. Buyer protection does NOT depend on it: purchase data is kept
  # current by the hourly orders sync and by every scan (app/orders/sync.ts), and
  # a scan protects everyone when that data is not current.
  # Disabled until protected customer data access (email) is granted in the Dev
  # Dashboard (docs/13-INSTRUCTIVO-CUENTAS.md, A4): Shopify rejects the whole app
  # version while the app is not approved for it. include_fields keeps the payload
  # to what the handler reads; nothing else of the order reaches the app.
  # [[webhooks.subscriptions]]
  # topics = ["orders/create"]
  # uri = "/webhooks/orders/create"
  # include_fields = ["email", "processed_at", "created_at", "test", "customer.id"]

  # Mandatory compliance topics for App Store apps.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
